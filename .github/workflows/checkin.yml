name: MiniMax 每日签到

on:
  schedule:
    # ⚠️ 这两条只是「额外保险」，不是主触发源。
    # 实测：免费个人账号上 GitHub 的 cron 调度器对该仓库完全不触发
    #（仓库已设为 public、最小对照 workflow 同样零触发，平台状态正常）。
    # 主触发由外部调度器每天 workflow_dispatch 触发本工作流，
    # 随机时刻仍由脚本自己在 08:00-08:30 内选择并等待。
    - cron: "7 0 * * *"     # 08:07 北京，备用
    - cron: "37 0 * * *"    # 08:37 北京，备用
  workflow_dispatch:      # ← 主触发路径：外部调度器每天调它

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 脚本要 sleep 到 08:00-08:30 之间的随机时刻，再算上排队延迟，留足余量
    timeout-minutes: 90
    env:
      MINIMAX_REGION: ${{ vars.MINIMAX_REGION || 'cn' }}
      MINIMAX_TIMEZONE: ${{ vars.MINIMAX_TIMEZONE || 'Asia/Shanghai' }}
      MINIMAX_NOTIFY_URL: ${{ secrets.MINIMAX_NOTIFY_URL }}
      # 随机签到窗口（按 MINIMAX_TIMEZONE 计时）
      SIGNIN_WINDOW: ${{ vars.SIGNIN_WINDOW || '08:00-08:30' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 关键：把上一次运行保存的东西取回来 ──────────────────────────
      # 缓存里有两个文件：
      #   credentials.json —— 续期后的新令牌
      #   state.json       —— 今天随机选中的那一刻
      #
      # 为什么要缓存而不是只用 Secret？
      #   OAuth 续期时 refresh_token 会轮换，旧的那个立刻作废。
      #   如果只存在 Secret 里不更新，第二次运行就会拿一个已作废的
      #   refresh_token 去换令牌，直接 invalid_grant 死掉。
      #
      #   state.json 同理：没有它，每次运行都会重新随机一个时刻。
      #
      #   用默认 GITHUB_TOKEN 就能存，不需要额外的 PAT。
      - name: 恢复缓存
        uses: actions/cache/restore@v4
        with:
          path: ~/.minimax/checkin
          key: minimax-cred-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: minimax-cred-

      # 第一次运行时没有缓存，用 Secret 里的初始凭据兜底
      - name: 初始化凭据
        env:
          CRED: ${{ secrets.MINIMAX_CREDENTIALS }}
        run: |
          mkdir -p ~/.minimax/checkin
          if [ ! -f ~/.minimax/checkin/credentials.json ]; then
            printf '%s' "$CRED" > ~/.minimax/checkin/credentials.json
            chmod 600 ~/.minimax/checkin/credentials.json
            echo "已从 Secret 初始化凭据"
          else
            echo "使用缓存中的凭据"
          fi

      # --wait：还没到今天随机选中的时刻就等在那儿，到点自动签
      # --catch-up：调度器延迟导致错过窗口时，今天还没签就补签一次（宁可晚签别漏签）
      - name: 签到
        run: python3 minimax_checkin.py checkin --window "$SIGNIN_WINDOW" --wait --catch-up --json

      # 把续期后的凭据 + 今天随机选中的时刻存回去
      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.minimax/checkin
          key: minimax-cred-${{ github.run_id }}-${{ github.run_attempt }}
