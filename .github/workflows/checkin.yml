name: MiniMax 每日签到

on:
  schedule:
    # 备用触发。实测 GitHub 的 cron 会触发，但常常延迟几小时（最晚见到 +4h19m），
    # 所以真正的「准时」触发靠外部调度器在 07:52 调 workflow_dispatch；
    # 这两条 cron 只做兜底 —— 就算延迟到窗口之后，--catch-up 也会立刻补签。
    - cron: "7 0 * * *"     # 08:07 北京，兜底
    - cron: "37 0 * * *"    # 08:37 北京，兜底
  workflow_dispatch:      # ← 主触发路径：外部调度器每天 07:52 调它

permissions:
  contents: read

# 同一时间只允许一个签到实例在跑。
# 原因：refresh_token 是一次性的，两个实例同时用同一代凭据续期，
# 必然有一个拿到 invalid_grant。串行化后，后面的实例会读到前一个写回的新凭据。
concurrency:
  group: minimax-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 脚本要 sleep 到 08:00-08:30 之间的随机时刻，再算上排队延迟，留足余量
    timeout-minutes: 90
    env:
      MINIMAX_REGION: ${{ vars.MINIMAX_REGION || 'cn' }}
      MINIMAX_TIMEZONE: ${{ vars.MINIMAX_TIMEZONE || 'Asia/Shanghai' }}
      MINIMAX_NOTIFY_URL: ${{ secrets.MINIMAX_NOTIFY_URL }}
      # 随机签到窗口（按 MINIMAX_TIMEZONE 计时）
      SIGNIN_WINDOW: ${{ vars.SIGNIN_WINDOW || '08:00-08:30' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 只缓存「今天随机选中的时刻」，凭据绝不进缓存 ──────────────────
      # 缓存里如果存了凭据，就会出现第二份 refresh_token 副本，
      # 两份副本互相消耗 refresh_token —— 这是之前每天 invalid_grant 的根因。
      - name: 恢复状态
        uses: actions/cache/restore@v4
        with:
          path: ~/.minimax/checkin/state.json
          key: minimax-state-${{ github.run_id }}
          restore-keys: minimax-state-

      # ── 凭据唯一真源 = 仓库 Secret MINIMAX_CREDENTIALS ─────────────────
      # 每次运行都无条件用 Secret 覆盖本地文件：
      # 上一轮续期后的新凭据已经被写回 Secret，这里读到的永远是最新的那一代。
      - name: 初始化凭据
        env:
          CRED: ${{ secrets.MINIMAX_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.minimax/checkin
          if [ -z "$CRED" ]; then
            echo "::error::Secret MINIMAX_CREDENTIALS 为空，先补上凭据"
            exit 1
          fi
          printf '%s' "$CRED" > ~/.minimax/checkin/credentials.json
          chmod 600 ~/.minimax/checkin/credentials.json
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.path.expanduser("~/.minimax/checkin/credentials.json")))
          a = d["accounts"][0]
          print("凭据就位 token=%s refresh=%s" % (a["token"][:12], a["refresh_token"][:12]))
          PY

      # --wait：还没到今天随机选中的时刻就等在那儿，到点自动签
      # --catch-up：调度器延迟导致错过窗口时，今天还没签就补签一次（宁可晚签别漏签）
      - name: 签到
        run: python3 minimax_checkin.py checkin --window "$SIGNIN_WINDOW" --wait --catch-up --json

      # ── 续期后原地写回 Secret：整个方案的关键一步 ─────────────────────
      # OAuth 续期会轮换 refresh_token，旧的那个立刻作废。
      # 如果不把新凭据写回 Secret，下一次运行就会拿一个已作废的
      # refresh_token 去换令牌，直接 invalid_grant 死掉。
      #
      # 写法：整个文件原样写回（脚本 save_credentials 写出来的就是
      # {"version":1,"updated_at":...,"accounts":[...]} 结构，和 Secret 同款）。
      - name: 写回凭据
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          F="$HOME/.minimax/checkin/credentials.json"
          if [ ! -f "$F" ]; then
            echo "没有凭据文件，跳过写回"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.path.expanduser("~/.minimax/checkin/credentials.json")))
          accs = d.get("accounts") or []
          assert accs, "accounts 为空"
          a = accs[0]
          assert a.get("token") and a.get("refresh_token"), "凭据不完整"
          print("待写回 token=%s refresh=%s" % (a["token"][:12], a["refresh_token"][:12]))
          PY
          gh secret set MINIMAX_CREDENTIALS --repo "$GITHUB_REPOSITORY" --body "$(cat "$F")"
          echo "已写回 Secret MINIMAX_CREDENTIALS"

      # 把今天随机选中的时刻存回去（只存 state.json，不含任何凭据）
      - name: 保存状态
        if: always()
        run: |
          mkdir -p ~/.minimax/checkin
          [ -f ~/.minimax/checkin/state.json ] || echo '{}' > ~/.minimax/checkin/state.json

      - name: 保存状态缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.minimax/checkin/state.json
          key: minimax-state-${{ github.run_id }}
